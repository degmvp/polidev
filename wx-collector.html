<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLYDEV | WX-Collector</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #4cc9f0;
}

header {
    text-align: center;
    padding: 24px;
    border-bottom: 3px solid #4cc9f0;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    color: yellowgreen;
    font-size: 18px;
    font-weight: bold;
}

#headerInfo {
    margin-top: 10px;
    color: #FFD700;
    font-weight: bold;
}

.banner {
    width: 55%;
    max-width: 900px;
    display: block;
    margin: 18px auto 28px;
    border: 2px solid #4cc9f0;
    border-radius: 8px;
}

.selector-box {
    width: 96%;
    margin: 0 auto 20px;
    padding: 16px;
    background: #00101f;
    border: 2px solid #4cc9f0;
    border-radius: 10px;
    text-align: center;
}

.selector-box label {
    display: block;
    margin-bottom: 10px;
    color: #FFD700;
    font-weight: bold;
}

.selector-box select {
    min-width: 340px;
    max-width: 95%;
    padding: 11px;
    background: #111;
    color: #FFD700;
    border: 1px solid #4cc9f0;
    border-radius: 8px;
    font-weight: bold;
}

.status {
    width: 96%;
    margin: 0 auto 20px;
    text-align: center;
    color: #fff;
}

.layout {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 25px;
    width: 96%;
    margin: auto;
}

.sidebar {
    padding: 15px;
    border-right: 3px solid #4cc9f0;
}

.sidebar h2 {
    margin-top: 0;
}

.block-title {
    margin: 22px 0 10px;
    padding: 8px;
    color: #000;
    background: #4cc9f0;
    border-radius: 6px;
    font-weight: bold;
}

.menu-btn {
    width: 100%;
    display: block;
    margin: 8px 0;
    padding: 12px;
    background: #111;
    color: #FFD700;
    border: 1px solid #4cc9f0;
    border-radius: 8px;
    text-align: left;
    font-weight: bold;
    cursor: pointer;
}

.menu-btn:hover {
    background: #4cc9f0;
    color: #000;
}

.content {
    padding: 15px;
}

.content h2 {
    color: #FFD700;
}

.toolbar {
    margin-bottom: 15px;
}

.tool-btn {
    display: inline-block;
    padding: 10px 14px;
    margin-right: 8px;
    background: #4cc9f0;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.tool-btn:hover {
    background: #FFD700;
}

.viewer {
    min-height: 620px;
    padding: 20px;
    overflow: auto;
    background: #00101f;
    color: #fff;
    border: 2px solid #4cc9f0;
    border-radius: 10px;
}

pre {
    margin: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.45;
}

footer {
    margin-top: 40px;
    padding: 28px;
    text-align: center;
    border-top: 3px solid #4cc9f0;
    color: yellowgreen;
    font-weight: bold;
}

footer img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #4cc9f0;
}

@media (max-width: 850px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: none;
        border-bottom: 3px solid #4cc9f0;
    }

    .banner {
        width: 90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>POLYDEV | WX-Collector</h1>

    <p>
        Uma árvore • Muitas linguagens • Um único viewer
    </p>

    <div id="headerInfo">
        Selecione uma branch WX
    </div>
</header>

<img
    src="wx.jpg"
    class="banner"
    alt="POLYDEV WX-Collector"
>

<section class="selector-box">

    <label for="linguagem">
        Selecione a linguagem WX
    </label>

    <select id="linguagem">
        <option value="">
            -- carregando categorias --
        </option>
    </select>

</section>

<div id="status" class="status">
    Consultando banco...
</div>

<div class="layout">

    <aside class="sidebar">

        <h2 id="tituloMenu">
            WX-Collector
        </h2>

        <div id="menuWX">
            Selecione uma linguagem.
        </div>

    </aside>

    <main class="content">

        <h2 id="tituloConteudo">
            Selecione uma linguagem WX
        </h2>

        <div class="toolbar">

            <button
                class="tool-btn"
                onclick="copiarConteudo()">
                Copiar Conteúdo
            </button>

            <a
                id="downloadBtn"
                class="tool-btn"
                href="#"
                download>
                Download
            </a>

            <button
                class="tool-btn"
                onclick="location.href='home.html'">
                Voltar Home
            </button>

        </div>

        <div class="viewer">
            <pre id="codigo">Aguardando seleção.</pre>
        </div>

    </main>

</div>

<footer>

    <img
        src="poly.jpg"
        alt="POLYDEV"
    >

    <h2>POLYDEV WX-COLLECTOR</h2>

    <p>
        Leia • Entenda • Explore seu código
    </p>

</footer>

<script>
const TABELA = "tb_teste";
const TAMANHO_BLOCO = 20;

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let branchAtual = "";
let registrosAtuais = [];
let conteudoAtual = "";


/* =========================================================
   BRANCH
   ========================================================= */

function extrairBranch(categoria) {

    const texto = String(categoria || "")
        .trim()
        .toLowerCase();

    /*
        wxpy01 -> wxpy
        wxpy02 -> wxpy
        wxpy   -> wxpy

        wxrs01 -> wxrs
        wxgo01 -> wxgo
        wxcp01 -> wxcp
    */

    const match = texto.match(
        /^(wx[a-z]+)/
    );

    if (!match) {
        return "";
    }

    return match[1];
}


/* =========================================================
   NOME DA LINGUAGEM
   ========================================================= */

function nomeLinguagem(branch) {

    const nomes = {
        wxpy: "Python",
        wxrs: "Rust",
        wxgo: "Go",
        wxcp: "C++"
    };

    return nomes[branch] ||
           branch.toUpperCase();
}


/* =========================================================
   SEQUENCIAL
   ========================================================= */

function extrairSequencial(programa) {

    const texto = String(programa || "")
        .trim()
        .toLowerCase();

    const match = texto.match(
        /^wx-[a-z0-9]+-(\d{3})-/
    );

    if (!match) {
        return Number.MAX_SAFE_INTEGER;
    }

    const numero = Number(match[1]);

    /*
        000 representa 1000
    */

    return numero === 0
        ? 1000
        : numero;
}


function formatarSequencial(numero) {

    if (numero === 1000) {
        return "000";
    }

    return String(numero)
        .padStart(3, "0");
}


/* =========================================================
   URL
   ========================================================= */

function normalizarUrl(url) {

    if (!url) {
        return "";
    }

    return String(url)
        .trim()
        .replace(/^\/+/, "");
}


function montarUrlLeitura(url) {

    const limpo =
        normalizarUrl(url);

    if (!limpo) {
        return "";
    }

    if (
        window.location.protocol ===
        "file:"
    ) {
        return (
            "https://degmvp.github.io/polidev/" +
            limpo
        );
    }

    return limpo;
}


/* =========================================================
   CARREGA COMBO
   ========================================================= */

async function carregarCategorias() {

    const combo =
        document.getElementById(
            "linguagem"
        );

    const status =
        document.getElementById(
            "status"
        );

    try {

        /*
            Busca somente categoria.

            O banco inteiro NÃO é preparado
            para visualização.
        */

        const { data, error } =
            await client
                .from(TABELA)
                .select("categoria")
                .order(
                    "categoria",
                    {
                        ascending: true
                    }
                );


        if (error) {
            throw error;
        }


        const branches = new Set();


        (data || []).forEach(item => {

            const branch =
                extrairBranch(
                    item.categoria
                );

            if (branch) {
                branches.add(branch);
            }

        });


        const lista =
            Array.from(branches)
                .sort();


        combo.innerHTML = "";


        const primeira =
            document.createElement(
                "option"
            );

        primeira.value = "";

        primeira.textContent =
            "-- escolha uma linguagem --";

        combo.appendChild(
            primeira
        );


        lista.forEach(branch => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                branch;

            option.textContent =
                branch +
                " — " +
                nomeLinguagem(branch);

            combo.appendChild(
                option
            );

        });


        status.textContent =
            lista.length +
            " linguagem(ns) WX encontrada(s).";


        document.getElementById(
            "codigo"
        ).textContent =
            "Selecione uma linguagem WX.";


    } catch (erro) {

        combo.innerHTML =
            '<option value="">-- erro --</option>';

        status.textContent =
            "Erro ao carregar categorias.";

        document.getElementById(
            "codigo"
        ).textContent =
            erro.message;

    }
}


/* =========================================================
   ESCOLHA DA LINGUAGEM
   ========================================================= */

async function carregarBranch() {

    const combo =
        document.getElementById(
            "linguagem"
        );

    const menu =
        document.getElementById(
            "menuWX"
        );

    const status =
        document.getElementById(
            "status"
        );

    const codigo =
        document.getElementById(
            "codigo"
        );


    branchAtual =
        combo.value;


    registrosAtuais = [];
    conteudoAtual = "";


    document.getElementById(
        "downloadBtn"
    ).href = "#";


    if (!branchAtual) {

        document.getElementById(
            "headerInfo"
        ).textContent =
            "Selecione uma branch WX";


        document.getElementById(
            "tituloMenu"
        ).textContent =
            "WX-Collector";


        document.getElementById(
            "tituloConteudo"
        ).textContent =
            "Selecione uma linguagem WX";


        menu.innerHTML =
            "Selecione uma linguagem.";


        codigo.textContent =
            "Aguardando seleção.";


        return;
    }


    const nome =
        nomeLinguagem(
            branchAtual
        );


    document.getElementById(
        "headerInfo"
    ).textContent =
        "Branch ativa: " +
        branchAtual +
        " | " +
        nome;


    document.getElementById(
        "tituloMenu"
    ).textContent =
        "Menu " + nome;


    document.getElementById(
        "tituloConteudo"
    ).textContent =
        "Carregando " +
        nome +
        "...";


    menu.innerHTML =
        "Montando menu...";


    codigo.textContent =
        "Consultando " +
        branchAtual +
        "...";


    status.textContent =
        "Carregando " +
        branchAtual +
        "...";


    try {

        /*
            SOMENTE A BRANCH ESCOLHIDA
        */

        const { data, error } =
            await client
                .from(TABELA)
                .select(
                    "id," +
                    "titulo," +
                    "categoria," +
                    "arquivo_url," +
                    "downloads," +
                    "ativo," +
                    "programa"
                )
                .like(
                    "categoria",
                    branchAtual + "%"
                )
                .eq(
                    "ativo",
                    true
                );


        if (error) {
            throw error;
        }


        /*
            CONFIRMA A BRANCH
        */

        registrosAtuais =
            (data || [])
                .filter(item =>
                    extrairBranch(
                        item.categoria
                    ) ===
                    branchAtual
                );


        /*
            ORDENA PELO SEQUENCIAL
        */

        registrosAtuais.sort(
            (a, b) => {

                const numeroA =
                    extrairSequencial(
                        a.programa
                    );

                const numeroB =
                    extrairSequencial(
                        b.programa
                    );

                return (
                    numeroA -
                    numeroB
                );
            }
        );


        if (
            registrosAtuais.length === 0
        ) {

            menu.innerHTML =
                "Nenhum conteúdo encontrado.";

            codigo.textContent =
                "Nenhum conteúdo encontrado.";

            status.textContent =
                "0 conteúdos.";

            return;
        }


        montarMenu();


        const blocos =
            Math.ceil(
                registrosAtuais.length /
                TAMANHO_BLOCO
            );


        status.textContent =
            branchAtual +
            " | " +
            registrosAtuais.length +
            " conteúdo(s) | " +
            blocos +
            " bloco(s).";


        document.getElementById(
            "tituloConteudo"
        ).textContent =
            nome +
            " | " +
            registrosAtuais.length +
            " conteúdos";


        codigo.textContent =
            "Selecione um programa no menu lateral.";


    } catch (erro) {

        menu.innerHTML =
            "Erro ao carregar.";

        codigo.textContent =
            erro.message;

        status.textContent =
            "Erro.";

    }
}


/* =========================================================
   MONTA BLOCOS DE 20
   ========================================================= */

function montarMenu() {

    const menu =
        document.getElementById(
            "menuWX"
        );


    menu.innerHTML = "";


    for (
        let inicio = 0;
        inicio < registrosAtuais.length;
        inicio += TAMANHO_BLOCO
    ) {

        const bloco =
            registrosAtuais.slice(
                inicio,
                inicio +
                TAMANHO_BLOCO
            );


        const numeroBloco =
            Math.floor(
                inicio /
                TAMANHO_BLOCO
            ) + 1;


        const primeiro =
            extrairSequencial(
                bloco[0].programa
            );


        const ultimo =
            extrairSequencial(
                bloco[
                    bloco.length - 1
                ].programa
            );


        const titulo =
            document.createElement(
                "div"
            );


        titulo.className =
            "block-title";


        titulo.textContent =
            "WX" +
            String(
                numeroBloco
            ).padStart(
                2,
                "0"
            ) +
            " — " +
            formatarSequencial(
                primeiro
            ) +
            "–" +
            formatarSequencial(
                ultimo
            );


        menu.appendChild(
            titulo
        );


        bloco.forEach(item => {

            const botao =
                document.createElement(
                    "button"
                );


            botao.className =
                "menu-btn";


            botao.textContent =
                item.programa +
                " — " +
                item.titulo;


            botao.onclick =
                function () {

                    abrirConteudo(
                        item
                    );

                };


            menu.appendChild(
                botao
            );

        });

    }
}


/* =========================================================
   ABRE CONTEÚDO
   ========================================================= */

async function abrirConteudo(item) {

    const url =
        normalizarUrl(
            item.arquivo_url
        );


    const urlLeitura =
        montarUrlLeitura(
            item.arquivo_url
        );


    document.getElementById(
        "tituloConteudo"
    ).textContent =
        item.programa +
        " — " +
        item.titulo;


    document.getElementById(
        "downloadBtn"
    ).href =
        url;


    try {

        const resposta =
            await fetch(
                urlLeitura
            );


        if (!resposta.ok) {

            throw new Error(
                "Arquivo não encontrado: " +
                urlLeitura
            );

        }


        conteudoAtual =
            await resposta.text();


        document.getElementById(
            "codigo"
        ).textContent =
            conteudoAtual;


    } catch (erro) {

        conteudoAtual = "";


        document.getElementById(
            "codigo"
        ).textContent =
            "Falha ao carregar o arquivo.\n\n" +
            "URL no banco: " +
            url +
            "\nURL tentada: " +
            urlLeitura +
            "\n\nErro: " +
            erro.message;

    }
}


/* =========================================================
   COPIAR
   ========================================================= */

function copiarConteudo() {

    if (!conteudoAtual) {

        alert(
            "Nenhum conteúdo carregado."
        );

        return;

    }


    navigator.clipboard
        .writeText(
            conteudoAtual
        )
        .then(() =>
            alert(
                "Conteúdo copiado."
            )
        )
        .catch(() =>
            alert(
                "Não foi possível copiar."
            )
        );
}


/* =========================================================
   EVENTOS
   ========================================================= */

document
    .getElementById(
        "linguagem"
    )
    .addEventListener(
        "change",
        carregarBranch
    );


/* =========================================================
   START
   ========================================================= */

carregarCategorias();
</script>

</body>
</html>
