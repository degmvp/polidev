<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLYDEV | WX-Collector</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #4cc9f0;
}

header {
    text-align: center;
    padding: 24px;
    border-bottom: 3px solid #4cc9f0;
}

header h1 {
    margin: 0;
    font-size: 34px;
    color: #4cc9f0;
}

header p {
    color: yellowgreen;
    font-size: 18px;
    font-weight: bold;
}

.header-info {
    margin-top: 12px;
    color: #FFD700;
    font-size: 16px;
}

.banner {
    width: 55%;
    max-width: 900px;
    display: block;
    margin: 18px auto 28px;
    border: 2px solid #4cc9f0;
    border-radius: 8px;
}

.selector-box {
    width: 96%;
    margin: 0 auto 18px;
    padding: 16px;
    border: 2px solid #4cc9f0;
    border-radius: 10px;
    background: #00101f;
    text-align: center;
}

.selector-box label {
    display: block;
    color: #FFD700;
    font-weight: bold;
    margin-bottom: 10px;
}

.selector-box select {
    min-width: 330px;
    max-width: 95%;
    padding: 11px;
    background: #111;
    color: #FFD700;
    border: 1px solid #4cc9f0;
    border-radius: 8px;
    font-weight: bold;
}

.status {
    width: 96%;
    margin: 0 auto 20px;
    color: #fff;
    text-align: center;
    font-size: 14px;
}

.layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 25px;
    width: 96%;
    margin: auto;
}

.sidebar {
    border-right: 3px solid #4cc9f0;
    padding: 15px;
}

.sidebar h2 {
    color: #4cc9f0;
    margin-top: 0;
}

.block-title {
    color: #FFD700;
    margin: 22px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #4cc9f0;
    font-size: 16px;
}

.menu-btn {
    width: 100%;
    display: block;
    margin: 8px 0;
    padding: 12px;
    background: #111;
    color: #FFD700;
    border: 1px solid #4cc9f0;
    border-radius: 8px;
    text-align: left;
    font-weight: bold;
    cursor: pointer;
}

.menu-btn:hover {
    background: #4cc9f0;
    color: #000;
}

.content {
    padding: 15px;
}

.content h2 {
    color: #FFD700;
    font-size: 28px;
}

.toolbar {
    margin-bottom: 15px;
}

.tool-btn {
    display: inline-block;
    padding: 10px 14px;
    margin-right: 8px;
    background: #4cc9f0;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.tool-btn:hover {
    background: #FFD700;
}

.viewer {
    background: #00101f;
    color: #fff;
    border: 2px solid #4cc9f0;
    border-radius: 10px;
    padding: 20px;
    min-height: 620px;
    overflow: auto;
}

pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.45;
    margin: 0;
}

footer {
    text-align: center;
    margin-top: 40px;
    padding: 28px;
    border-top: 3px solid #4cc9f0;
    color: yellowgreen;
    font-weight: bold;
}

footer img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #4cc9f0;
}

@media (max-width: 850px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: none;
        border-bottom: 3px solid #4cc9f0;
    }

    .banner {
        width: 90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>POLYDEV | WX-Collector</h1>

    <p>
        Uma árvore • Muitas linguagens • Um único viewer
    </p>

    <div id="headerInfo" class="header-info">
        Selecione uma branch WX
    </div>
</header>

<img src="wx.jpg" class="banner" alt="POLYDEV WX-Collector">

<section class="selector-box">

    <label for="linguagem">
        Selecione a branch / linguagem WX
    </label>

    <select id="linguagem">
        <option value="">
            -- carregando branches WX --
        </option>
    </select>

</section>

<div id="status" class="status">
    Descobrindo categorias WX...
</div>

<div class="layout">

    <aside class="sidebar">

        <h2 id="tituloMenu">
            WX-Collector
        </h2>

        <div id="menuWX">
            Selecione uma linguagem acima.
        </div>

    </aside>

    <main class="content">

        <h2 id="tituloConteudo">
            Selecione uma branch WX
        </h2>

        <div class="toolbar">

            <button
                class="tool-btn"
                onclick="copiarConteudo()">
                Copiar Conteúdo
            </button>

            <a
                id="downloadBtn"
                class="tool-btn"
                href="#"
                download>
                Download
            </a>

            <button
                class="tool-btn"
                onclick="location.href='home.html'">
                Voltar Home
            </button>

        </div>

        <div class="viewer">
            <pre id="codigo">Aguardando seleção.</pre>
        </div>

    </main>

</div>

<footer>

    <img src="poly.jpg" alt="POLYDEV">

    <h2>
        POLYDEV WX-COLLECTOR
    </h2>

    <p>
        Leia • Entenda • Explore seu código
    </p>

</footer>

<script>
const TABELA = "conteudos";
const TAMANHO_BLOCO = 20;

let db;
let branchAtual = "";
let conteudosWX = [];
let conteudoAtual = "";


/* =========================================================
   SUPABASE
   ========================================================= */

function criarCliente() {
    if (!db) {
        db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    }

    return db;
}


/* =========================================================
   URL
   ========================================================= */

function normalizarUrl(url) {
    if (!url) {
        return "";
    }

    return String(url)
        .trim()
        .replace(/^\/+/, "");
}


function montarUrlLeitura(url) {
    const limpo = normalizarUrl(url);

    if (!limpo) {
        return "";
    }

    if (window.location.protocol === "file:") {
        return (
            "https://degmvp.github.io/polidev/" +
            limpo
        );
    }

    return limpo;
}


/* =========================================================
   CATEGORIA / BRANCH

   ESTADO ATUAL:
       wxpy01
       wxrs01
       wxgo01
       wxcp01

   RESULTADO:
       wxpy
       wxrs
       wxgo
       wxcp
   ========================================================= */

function extrairBranch(categoria) {
    const texto = String(categoria || "")
        .trim()
        .toLowerCase();

    /*
       PADRÃO ACEITO:

       wx + letras
       seguido opcionalmente por números

       wxpy
       wxpy01
       wxpy02

       wxrs
       wxrs01

       wxgo
       wxgo01

       wxcp
       wxcp01
    */

    const match = texto.match(
        /^(wx[a-z]+)(?:\d+)?$/
    );

    if (!match) {
        return "";
    }

    return match[1];
}


/* =========================================================
   SEQUENCIAL

   wx-py-001-wxpy
   wx-rs-001-wxrs
   wx-go-001-wxgo
   wx-cp-001-wxcp

   000 = 1000
   ========================================================= */

function extrairSequencial(programa) {
    const texto = String(programa || "")
        .trim()
        .toLowerCase();

    const match = texto.match(
        /^wx-[a-z0-9]+-(\d{3})-/
    );

    if (!match) {
        return Number.MAX_SAFE_INTEGER;
    }

    const numero = Number(match[1]);

    if (numero === 0) {
        return 1000;
    }

    return numero;
}


function formatarSequencial(numero) {
    if (numero === 1000) {
        return "000";
    }

    return String(numero)
        .padStart(3, "0");
}


/* =========================================================
   NOME VISUAL DA BRANCH

   NÃO PARTICIPA DA LÓGICA DO BANCO.
   ========================================================= */

function nomeBranch(branch) {
    const nomes = {
        wxpy: "Python",
        wxrs: "Rust",
        wxgo: "Go",
        wxcp: "C++"
    };

    return nomes[branch] || branch.toUpperCase();
}


/* =========================================================
   START

   PRIMEIRA ETAPA:
   LÊ SOMENTE CATEGORIAS.

   NÃO LÊ ARQUIVOS.
   NÃO MONTA MENUS.
   NÃO CARREGA CONTEÚDOS.
   ========================================================= */

async function iniciarCollector() {
    const combo =
        document.getElementById("linguagem");

    const status =
        document.getElementById("status");

    const codigo =
        document.getElementById("codigo");

    try {
        const cliente = criarCliente();

        /*
           IMPORTANTE:

           A tabela pode ter centenas de registros.
           Aqui buscamos SOMENTE a coluna categoria.

           O objetivo é descobrir as branches existentes.
        */

        const { data, error } = await cliente
            .from(TABELA)
            .select("categoria")
            .eq("ativo", true)
            .order("categoria", {
                ascending: true
            })
            .limit(5000);

        if (error) {
            throw error;
        }

        /*
           FILTRO WX.

           Todo o restante do ecossistema é ignorado.
        */

        const branches = [
            ...new Set(
                (data || [])
                    .map(item =>
                        extrairBranch(
                            item.categoria
                        )
                    )
                    .filter(branch =>
                        branch !== ""
                    )
            )
        ].sort();


        combo.innerHTML = "";


        const inicial =
            document.createElement("option");

        inicial.value = "";
        inicial.textContent =
            "-- escolha uma linguagem --";

        combo.appendChild(inicial);


        branches.forEach(branch => {
            const option =
                document.createElement("option");

            option.value = branch;

            option.textContent =
                branch +
                " — " +
                nomeBranch(branch);

            combo.appendChild(option);
        });


        if (branches.length === 0) {
            status.textContent =
                "Nenhuma branch WX encontrada.";

            codigo.textContent =
                "Nenhuma categoria WX padronizada encontrada no banco.";

            return;
        }


        status.textContent =
            branches.length +
            " branch(es) WX encontrada(s).";


        codigo.textContent =
            "Selecione uma branch WX.";


        combo.addEventListener(
            "change",
            carregarBranch
        );

    } catch (e) {
        combo.innerHTML =
            '<option value="">-- erro --</option>';

        status.textContent =
            "Falha ao descobrir branches WX.";

        codigo.textContent =
            e.message;
    }
}


/* =========================================================
   CARREGA SOMENTE A BRANCH ESCOLHIDA
   ========================================================= */

async function carregarBranch() {
    const combo =
        document.getElementById("linguagem");

    const menu =
        document.getElementById("menuWX");

    const status =
        document.getElementById("status");

    const codigo =
        document.getElementById("codigo");

    const branch = combo.value;


    branchAtual = branch;
    conteudosWX = [];
    conteudoAtual = "";

    document.getElementById(
        "downloadBtn"
    ).href = "#";


    if (!branch) {
        document.getElementById(
            "headerInfo"
        ).textContent =
            "Selecione uma branch WX";

        document.getElementById(
            "tituloMenu"
        ).textContent =
            "WX-Collector";

        document.getElementById(
            "tituloConteudo"
        ).textContent =
            "Selecione uma branch WX";

        menu.innerHTML =
            "Selecione uma linguagem acima.";

        codigo.textContent =
            "Aguardando seleção.";

        return;
    }


    const nome = nomeBranch(branch);


    document.getElementById(
        "headerInfo"
    ).textContent =
        "Branch ativa: " +
        branch +
        " | " +
        nome;


    document.getElementById(
        "tituloMenu"
    ).textContent =
        "Menu " + nome;


    document.getElementById(
        "tituloConteudo"
    ).textContent =
        "Carregando " + nome + "...";


    menu.innerHTML =
        "Preparando branch on the fly...";


    codigo.textContent =
        "Consultando " +
        branch +
        "...";


    status.textContent =
        "Lendo somente " +
        branch +
        "...";


    try {
        const cliente = criarCliente();


        /*
           BUSCA SOMENTE A BRANCH ESCOLHIDA.

           wxpy encontra:
               wxpy
               wxpy01
               wxpy02
               ...

           Nenhuma outra linguagem é carregada.
        */

        const { data, error } = await cliente
            .from(TABELA)
            .select(
                "id," +
                "titulo," +
                "categoria," +
                "arquivo_url," +
                "downloads," +
                "ativo," +
                "programa"
            )
            .like(
                "categoria",
                branch + "%"
            )
            .eq(
                "ativo",
                true
            )
            .limit(5000);


        if (error) {
            throw error;
        }


        /*
           SEGUNDO FILTRO DE SEGURANÇA.

           Garante correspondência exata da branch.
        */

        conteudosWX = (data || [])
            .filter(item =>
                extrairBranch(
                    item.categoria
                ) === branch
            );


        /*
           ORDENA PELO SEQUENCIAL DO PROGRAMA.
        */

        conteudosWX.sort((a, b) => {
            const numeroA =
                extrairSequencial(
                    a.programa
                );

            const numeroB =
                extrairSequencial(
                    b.programa
                );

            if (numeroA !== numeroB) {
                return numeroA - numeroB;
            }

            return String(
                a.programa || ""
            ).localeCompare(
                String(
                    b.programa || ""
                )
            );
        });


        if (conteudosWX.length === 0) {
            menu.innerHTML =
                "Nenhum conteúdo encontrado.";

            codigo.textContent =
                "Nenhum conteúdo encontrado para " +
                branch +
                ".";

            status.textContent =
                "0 conteúdos.";

            return;
        }


        montarMenu();


        const quantidadeBlocos =
            Math.ceil(
                conteudosWX.length /
                TAMANHO_BLOCO
            );


        status.textContent =
            branch +
            " | " +
            conteudosWX.length +
            " conteúdo(s) | " +
            quantidadeBlocos +
            " bloco(s).";


        document.getElementById(
            "tituloConteudo"
        ).textContent =
            nome +
            " | " +
            conteudosWX.length +
            " conteúdos";


        codigo.textContent =
            "Selecione um programa no menu lateral.";

    } catch (e) {
        menu.innerHTML =
            "Erro ao carregar branch.";

        codigo.textContent =
            e.message;

        status.textContent =
            "Falha ao carregar " +
            branch +
            ".";
    }
}


/* =========================================================
   MONTA GRUPOS DE NO MÁXIMO 20
   ========================================================= */

function montarMenu() {
    const menu =
        document.getElementById("menuWX");

    menu.innerHTML = "";


    for (
        let inicio = 0;
        inicio < conteudosWX.length;
        inicio += TAMANHO_BLOCO
    ) {
        const fim = Math.min(
            inicio + TAMANHO_BLOCO,
            conteudosWX.length
        );


        const bloco =
            conteudosWX.slice(
                inicio,
                fim
            );


        const primeiro =
            extrairSequencial(
                bloco[0].programa
            );


        const ultimo =
            extrairSequencial(
                bloco[
                    bloco.length - 1
                ].programa
            );


        const numeroBloco =
            Math.floor(
                inicio /
                TAMANHO_BLOCO
            ) + 1;


        const titulo =
            document.createElement("div");


        titulo.className =
            "block-title";


        titulo.textContent =
            "WX" +
            String(
                numeroBloco
            ).padStart(
                2,
                "0"
            ) +
            " — " +
            formatarSequencial(
                primeiro
            ) +
            "–" +
            formatarSequencial(
                ultimo
            );


        menu.appendChild(
            titulo
        );


        bloco.forEach(item => {
            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "menu-btn";


            const programa =
                String(
                    item.programa || ""
                ).trim();


            btn.textContent =
                programa +
                " — " +
                (
                    item.titulo ||
                    programa
                );


            btn.addEventListener(
                "click",
                () =>
                    abrirConteudo(
                        item
                    )
            );


            menu.appendChild(
                btn
            );
        });
    }
}


/* =========================================================
   ABRE CONTEÚDO
   ========================================================= */

async function abrirConteudo(item) {
    const url =
        normalizarUrl(
            item.arquivo_url
        );


    const urlLeitura =
        montarUrlLeitura(
            item.arquivo_url
        );


    document.getElementById(
        "tituloConteudo"
    ).textContent =
        (
            item.programa
                ? item.programa + " — "
                : ""
        ) +
        item.titulo;


    document.getElementById(
        "downloadBtn"
    ).href = url;


    try {
        const resposta =
            await fetch(
                urlLeitura
            );


        if (!resposta.ok) {
            throw new Error(
                "Arquivo não encontrado: " +
                urlLeitura
            );
        }


        conteudoAtual =
            await resposta.text();


        document.getElementById(
            "codigo"
        ).textContent =
            conteudoAtual;

    } catch (e) {
        conteudoAtual = "";


        document.getElementById(
            "codigo"
        ).textContent =
            "Falha ao carregar o arquivo.\n\n" +
            "URL no banco: " +
            url +
            "\nURL tentada: " +
            urlLeitura +
            "\n\nErro: " +
            e.message;
    }
}


/* =========================================================
   COPIAR
   ========================================================= */

function copiarConteudo() {
    if (!conteudoAtual) {
        alert(
            "Nenhum conteúdo carregado."
        );

        return;
    }


    navigator.clipboard
        .writeText(
            conteudoAtual
        )
        .then(() => {
            alert(
                "Conteúdo copiado."
            );
        })
        .catch(() => {
            alert(
                "Não foi possível copiar."
            );
        });
}


/* =========================================================
   START
   ========================================================= */

iniciarCollector();
</script>

</body>
</html>
